name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$TAG" != "v$VERSION" ]]; then
            printf 'Tag %s must match manifest version v%s\n' "$TAG" "$VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VSIX=local-model-provider-$VERSION.vsix" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: npm test

      - name: Check TypeScript compilation
        run: npm run test-compile

      - name: Package extension
        run: npm run package -- --out "$VSIX"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --repo "$GH_REPO" --clobber
          else
            FLAGS=()
            if [[ "${VERSION%%+*}" == *-* ]]; then
              FLAGS+=(--prerelease --latest=false)
            fi
            gh release create "$TAG" "$VSIX" --repo "$GH_REPO" \
              --verify-tag --generate-notes "${FLAGS[@]}"
          fi
